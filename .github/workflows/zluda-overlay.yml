name: ZLUDA immutable product proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ZLUDA_PACKAGING_PROFILE: ge-11-7
  PROTON_SOURCE_ROOT: ${{ github.workspace }}/proton-source
  PYTHONPATH: ${{ github.workspace }}/proton-source

jobs:
  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind the committed classifier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s migration/d32
          python3 - <<'PYVALIDATOR'
          import hashlib, json, os, pathlib, shutil, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'classifier'
          source=pathlib.Path('migration/d32')
          destination=root/source
          shutil.copytree(source,destination,ignore=shutil.ignore_patterns('__pycache__','*.pyc'))
          record={'commit':os.environ['GITHUB_SHA'],
            'classifier_tree':subprocess.check_output(['git','rev-parse','HEAD:migration/d32'],text=True).strip(),
            'files':{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in destination.rglob('*') if p.is_file()},
            'recipe_commit':'552eded7830055af9f0f424d820cf9f66754e31e',
            'proton_commit':'6d075ec1c0a7a93f23ddbe7b8278929d14c8a829'}
          (root.parent/'VALIDATOR.json').write_text(json.dumps(record,indent=2)+'\n')
          PYVALIDATOR
      - name: Checkout the immutable candidate recipes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 552eded7830055af9f0f424d820cf9f66754e31e
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - name: Admit the immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 552eded7830055af9f0f424d820cf9f66754e31e
          test "$(git -C "$PROTON_SOURCE_ROOT" rev-parse HEAD)" = 6d075ec1c0a7a93f23ddbe7b8278929d14c8a829
          mkdir -p "$RUNNER_TEMP/B"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13376294814 > "$RUNNER_TEMP/B/API.json"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13376294814/zip > "$RUNNER_TEMP/B/candidate.zip"
          python3 - <<'PYCANDIDATE'
          import hashlib, json, os, pathlib, zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'B'
          a=json.loads((p/'API.json').read_text())
          if a['workflow_run']['id']!=41935553932 or a['workflow_run']['head_sha']!='552eded7830055af9f0f424d820cf9f66754e31e': raise ValueError('wrong candidate source')
          expected='85669b891f5e9c74c68d4241a38faf03bcac9ebaef2a893ea989105b3a0242c4'
          if a['digest']!='sha256:'+expected or hashlib.file_digest((p/'candidate.zip').open('rb'),'sha256').hexdigest()!=expected: raise ValueError('candidate ZIP mismatch')
          with zipfile.ZipFile(p/'candidate.zip') as z:
            for n in ['GE-Proton11-7-zluda.tar.gz','MANIFEST','SHA256SUMS']: (p/n).write_bytes(z.read(n))
          expected={'GE-Proton11-7-zluda.tar.gz':'c4d715483973a8a467eeec387aa21351406f9e550299f0a710c0bcb4113e2a80','MANIFEST':'481c1a1aa33882ce82e1a4f653ceb8aebf8b001aeb46a149e5b03047d6ef73f1'}
          for n,h in expected.items():
            if hashlib.file_digest((p/n).open('rb'),'sha256').hexdigest()!=h: raise ValueError('candidate member mismatch: '+n)
          PYCANDIDATE
      - name: Admit the published d32 product control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash migration/d32/control.sh
          python3 - <<'PYCONTROL'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'d32-control'
          expected={'GE-Proton11-7-zluda.tar.gz':'4321f9b0e78e1314ef9ba62845f9f9bb9d79a4fb83de6ce54826802f8583edf0',
                    'MANIFEST':'e968d63bbf57aadcd0e976eb5597c1f8b1dc55d70e44ecf3f17a5e1d37384039'}
          for n,h in expected.items():
            if hashlib.file_digest((p/n).open('rb'),'sha256').hexdigest()!=h: raise ValueError('control member mismatch: '+n)
          PYCONTROL
      - name: Compare every actual shipping member and both manifests
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git -C "$PROTON_SOURCE_ROOT" submodule update --init --filter=blob:none -- zluda-wine
          PYTHONPATH="$GITHUB_WORKSPACE/packaging/zluda-overlay:$PYTHONPATH" python3 "$RUNNER_TEMP/classifier/migration/d32/product_identity.py" \
            --control "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" \
            --candidate "$RUNNER_TEMP/B/GE-Proton11-7-zluda.tar.gz" \
            --control-manifest "$RUNNER_TEMP/d32-control/MANIFEST" \
            --candidate-manifest "$RUNNER_TEMP/B/MANIFEST" \
            --output "$RUNNER_TEMP/PRODUCT-IDENTITY.json"
      - name: Retain the complete identity proof even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-identity
          path: |
            ${{ runner.temp }}/PRODUCT-IDENTITY.json
            ${{ runner.temp }}/VALIDATOR.json
            ${{ runner.temp }}/B/API.json
            ${{ runner.temp }}/B/SHA256SUMS
            ${{ runner.temp }}/d32-control/API.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare every Wine builtin against the published control and stock base
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/B"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python3 packaging/zluda-overlay/release_audit.py \
            --candidate "$RUNNER_TEMP/B/GE-Proton11-7-zluda.tar.gz" \
            --control "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" \
            --output "$RUNNER_TEMP/release-audit"
      - name: Retain the complete builtin and timestamp inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit
          path: |
            ${{ runner.temp }}/release-audit/*.json
            ${{ runner.temp }}/release-audit/*.tsv
          if-no-files-found: error
          retention-days: 90
