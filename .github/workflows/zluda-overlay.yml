name: ZLUDA immutable move proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ZLUDA_PACKAGING_PROFILE: ge-11-7
  PROTON_SOURCE_ROOT: ${{ github.workspace }}/proton-source
  PYTHONPATH: ${{ github.workspace }}/proton-source

jobs:
  release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind the committed classifier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest tests.test_product_identity
          cp packaging/zluda-overlay/product_identity.py "$RUNNER_TEMP/move-validator.py"
          python3 - <<'PYVALIDATOR'
          import hashlib, json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          (p/'VALIDATOR.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],
            'sha256':hashlib.sha256((p/'move-validator.py').read_bytes()).hexdigest(),
            'recipe_commit':'69a11ae1bce3d5217469db3b900260ce06e8566b',
            'proton_commit':'bd20ce7386a2d3cd9d7379855c6608ae27370ea9'},indent=2)+'\n')
          PYVALIDATOR
      - name: Checkout the immutable candidate recipes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 69a11ae1bce3d5217469db3b900260ce06e8566b
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the explicit Proton profile
        shell: bash
        run: |
          python3 - <<'PYPROFILE'
          import json, os
          p=json.load(open('packaging/zluda-overlay/profiles/'+os.environ['ZLUDA_PACKAGING_PROFILE']+'.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('PROTON_PIN='+p['source_commit']+'\n')
          PYPROFILE
      - name: Checkout the admitted Proton source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: chkuendig/proton-ge-custom
          ref: ${{ env.PROTON_PIN }}
          path: proton-source
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the immutable move candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 69a11ae1bce3d5217469db3b900260ce06e8566b
          test "$(git -C "$PROTON_SOURCE_ROOT" rev-parse HEAD)" = bd20ce7386a2d3cd9d7379855c6608ae27370ea9
          mkdir -p "$RUNNER_TEMP/B"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13368943372 > "$RUNNER_TEMP/B/API.json"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13368943372/zip > "$RUNNER_TEMP/B/candidate.zip"
          python3 - <<'PYCANDIDATE'
          import hashlib, json, os, pathlib, zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'B'
          a=json.loads((p/'API.json').read_text())
          if a['workflow_run']['id']!=41919492015 or a['workflow_run']['head_sha']!='69a11ae1bce3d5217469db3b900260ce06e8566b': raise ValueError('wrong move candidate source')
          expected='4a515dd3536fd172954b207410f019d57ff20741f0c01313d848533ee8c633d7'
          if a['digest']!='sha256:'+expected or hashlib.file_digest((p/'candidate.zip').open('rb'),'sha256').hexdigest()!=expected: raise ValueError('move candidate ZIP mismatch')
          with zipfile.ZipFile(p/'candidate.zip') as z:
            for n in ['GE-Proton11-7-zluda.tar.gz','MANIFEST','SHA256SUMS']: (p/n).write_bytes(z.read(n))
          expected={'GE-Proton11-7-zluda.tar.gz':'40b343c12702dee07c46721c60722e7c5d160ee477b5a4c48d46fa35c4b8f905',
                    'MANIFEST':'41cbdaee461e53184ec49a827e50b54b97599c53012e1a539567b97a0427435a'}
          for n,h in expected.items():
            if hashlib.file_digest((p/n).open('rb'),'sha256').hexdigest()!=h: raise ValueError('move candidate member mismatch: '+n)
          PYCANDIDATE
      - name: Admit the published d32 product control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d32-control"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13340662756 > "$RUNNER_TEMP/d32-control/API.json"
          gh api repos/chkuendig/proton-ge-custom/actions/artifacts/13340662756/zip > "$RUNNER_TEMP/d32-control/control.zip"
          python3 - <<'PYCONTROL'
          import hashlib, json, os, pathlib, zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'d32-control'
          a=json.loads((p/'API.json').read_text())
          if a['workflow_run']['id']!=41847768267 or a['workflow_run']['head_sha']!='d32c45244f7f719d6e37c962c52b1cbdc063ce2c': raise ValueError('wrong published control source')
          expected='714395e00187e52e8576244b97d89153123d0b24b0949334e0a623521e07961d'
          if a['digest']!='sha256:'+expected or hashlib.file_digest((p/'control.zip').open('rb'),'sha256').hexdigest()!=expected: raise ValueError('published control ZIP mismatch')
          with zipfile.ZipFile(p/'control.zip') as z:
            for n in ['GE-Proton11-7-zluda.tar.gz','MANIFEST']: (p/n).write_bytes(z.read(n))
          expected={'GE-Proton11-7-zluda.tar.gz':'4321f9b0e78e1314ef9ba62845f9f9bb9d79a4fb83de6ce54826802f8583edf0',
                    'MANIFEST':'e968d63bbf57aadcd0e976eb5597c1f8b1dc55d70e44ecf3f17a5e1d37384039'}
          for n,h in expected.items():
            if hashlib.file_digest((p/n).open('rb'),'sha256').hexdigest()!=h: raise ValueError('control member mismatch: '+n)
          PYCONTROL
      - name: Compare every actual shipping member and both manifests
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git -C "$PROTON_SOURCE_ROOT" submodule update --init --filter=blob:none -- zluda-wine
          PYTHONPATH="$GITHUB_WORKSPACE/packaging/zluda-overlay:$PYTHONPATH" python3 "$RUNNER_TEMP/move-validator.py" \
            --control "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" \
            --candidate "$RUNNER_TEMP/B/GE-Proton11-7-zluda.tar.gz" \
            --control-manifest "$RUNNER_TEMP/d32-control/MANIFEST" \
            --candidate-manifest "$RUNNER_TEMP/B/MANIFEST" \
            --output "$RUNNER_TEMP/PRODUCT-IDENTITY.json"
      - name: Retain the complete identity proof even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-identity
          path: |
            ${{ runner.temp }}/PRODUCT-IDENTITY.json
            ${{ runner.temp }}/VALIDATOR.json
            ${{ runner.temp }}/B/API.json
            ${{ runner.temp }}/B/SHA256SUMS
            ${{ runner.temp }}/d32-control/API.json
          if-no-files-found: error
          retention-days: 90
      - name: Download CI-built A1 at Proton 0fb8d56a
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GE-Proton11-7-zluda
          repository: chkuendig/proton-ge-custom
          run-id: 40906607864
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/A1
      - name: Verify both tool archives and compare every Wine builtin against A1 and stock GE
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/B"
          sha256sum -c SHA256SUMS
          cd "$RUNNER_TEMP/A1"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python3 packaging/zluda-overlay/release_audit.py --source "$PROTON_SOURCE_ROOT" \
            --candidate "$RUNNER_TEMP/B/GE-Proton11-7-zluda.tar.gz" \
            --a1 "$RUNNER_TEMP/A1/GE-Proton11-7-zluda.tar.gz" \
            --output "$RUNNER_TEMP/release-audit"
      - name: Retain the complete builtin and timestamp inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit
          path: |
            ${{ runner.temp }}/release-audit/*.json
            ${{ runner.temp }}/release-audit/*.tsv
          if-no-files-found: error
          retention-days: 90
