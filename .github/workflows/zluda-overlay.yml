name: Launcher behaviour CPU proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZLUDA_PACKAGING_PROFILE: ge-11-7
  PROTON_SOURCE_ROOT: ${{ github.workspace }}/proton-source
  PYTHONPATH: ${{ github.workspace }}/proton-source:${{ github.workspace }}/tests

jobs:
  launcher-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: chkuendig/proton-ge-custom
          ref: d9401ee3f20c25a0494c922d523e9c0b0752e2ee
          path: proton-source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind runtime and apply actual gamefix patches
        run: |
          set -euo pipefail
          test "$(git -C "$PROTON_SOURCE_ROOT" rev-parse HEAD)" = d9401ee3f20c25a0494c922d523e9c0b0752e2ee
          test "$(git -C "$PROTON_SOURCE_ROOT" rev-parse HEAD^)" = 6d075ec1c0a7a93f23ddbe7b8278929d14c8a829
          git -C "$PROTON_SOURCE_ROOT" submodule update --init --filter=blob:none -- protonfixes
      - name: Run launcher policy and prefix isolation CPU cases
        run: |
          set -euo pipefail
          python3 - <<'PYTESTS'
          import hashlib, json, os, pathlib, subprocess, sys, unittest
          root=pathlib.Path(os.environ['PROTON_SOURCE_ROOT'])
          def git(*args):
              return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
          changed=git('diff','--name-only','HEAD^','HEAD').splitlines()
          expected=['patches/protonfixes/0008-Select-ZLUDA-early-and-respect-explicit-opt-out.patch',
                    'patches/protonfixes/0009-Borderlands-2-enable-ZLUDA-before-prefix-setup.patch',
                    'proton','proton_zluda.py','utilities.py']
          if changed!=expected:raise ValueError('unexpected runtime scope')
          if (root/'utilities.py').read_bytes()!=subprocess.check_output(['git','-C',str(root),'show','c191f35dcebbeccfacd3b4c6f6eea026e588c1c2:utilities.py']):raise ValueError('utilities differs from GE')
          modules=['test_launcher_behaviour','test_proton_zluda','test_prefix_isolation','test_cuda_roots','test_launcher_cpu']
          suite=unittest.defaultTestLoader.loadTestsFromNames(modules)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          record={'status':'passed' if result.wasSuccessful() else 'failed',
            'tests':result.testsRun,'errors':len(result.errors),'failures':len(result.failures),
            'runtime_commit':git('rev-parse','HEAD'),
            'proof_commit':os.environ['GITHUB_SHA'],
            'runtime_files':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in expected},
            'test_files':{name:hashlib.sha256(pathlib.Path('tests',name+'.py').read_bytes()).hexdigest() for name in modules},
            'scope':'Python CPU checks and actual applied gamefix early functions; no Wine, GPU, SDK or containers'}
          pathlib.Path(os.environ['RUNNER_TEMP'],'LAUNCHER-CPU.json').write_text(json.dumps(record,indent=2)+'\n')
          if not result.wasSuccessful():sys.exit(1)
          PYTESTS
      - name: Retain bound CPU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-cpu
          path: ${{ runner.temp }}/LAUNCHER-CPU.json
          if-no-files-found: error
          retention-days: 90
