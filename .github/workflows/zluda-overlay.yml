name: ZLUDA overlay (manual)

on:
  workflow_dispatch:
    inputs:
      base:
        description: Explicit admitted Proton base profile
        type: choice
        default: ge-11-7
        options: [ge-11-7, valve-11-0]
      native_control_seed:
        description: Build the Valve native control and CPU harness only; no product assembly
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: zluda-overlay-${{ github.ref }}
  cancel-in-progress: false

env:
  ZLUDA_PACKAGING_PROFILE: ${{ inputs.base || 'ge-11-7' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - name: Static tests and shell syntax before component fetch/build
        run: |
          if [[ '${{ inputs.native_control_seed }}' == true ]]; then test "$ZLUDA_PACKAGING_PROFILE" = valve-11-0; fi
          git submodule update --init --filter=blob:none -- proton-source
          git -C proton-source submodule update --init --filter=blob:none -- dxvk-nvapi protonfixes
          ZLUDA_PACKAGING_PROFILE=ge-11-7 PROTON_SOURCE_ROOT="$GITHUB_WORKSPACE/proton-source" PYTHONPATH="$GITHUB_WORKSPACE/proton-source" python3 -m unittest discover -s tests
          if [[ $ZLUDA_PACKAGING_PROFILE == valve-11-0 ]]; then
            python3 -m unittest discover -s tests -p test_valve_profile.py
          fi
          test -f migration/d32/product_identity.py
          ZLUDA_PACKAGING_PROFILE=ge-11-7 PROTON_SOURCE_ROOT="$GITHUB_WORKSPACE/proton-source" PYTHONPATH="$GITHUB_WORKSPACE/proton-source" python3 -m unittest discover -s migration/d32
          for script in packaging/zluda-overlay/*.sh make/*.sh; do bash -n "$script"; done

  components:
    needs: static
    name: Build ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ inputs.native_control_seed && fromJSON('["zluda"]') || fromJSON('["zluda", "bridges"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false
          lfs: true
      - uses: ./.github/actions/proton-source
      - name: Checkout recursive component pins with LFS
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          read -r -a components <<< "$(python3 packaging/zluda-overlay/inputs.py checkout-paths "$PROTON_SOURCE_ROOT" --part "$PART")"
          git -C "$PROTON_SOURCE_ROOT" submodule update --init --recursive --filter=blob:none -- "${components[@]}"
          for component in "${components[@]}"; do
            git -C "$PROTON_SOURCE_ROOT/$component" lfs pull
            git -C "$PROTON_SOURCE_ROOT/$component" submodule foreach --recursive 'git lfs pull'
          done
          python3 packaging/zluda-overlay/inputs.py check "$PROTON_SOURCE_ROOT" --part "$PART"
      - name: Make room on the ephemeral GitHub runner
        run: |
          df -h /
          command -v bash git python3 docker tar gzip
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache
          if [[ "$ZLUDA_PACKAGING_PROFILE" == valve-11-0 && '${{ matrix.part }}' == bridges ]]; then
            sudo rm -rf /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
            # The locked SDK image is pulled in the build step below.
            docker image prune --all --force
          fi
          sudo mkdir -p /work
          sudo chown "$USER:$USER" /work
          command -v bash git python3 docker tar gzip
          df -h / /work
      # No registry/src or git checkouts: Cargo re-extracts archives and checks
      # Cargo.lock hashes. The fingerprint and admitted compiler-only fallbacks
      # retain the locked LLVM, SDK, Rust and compiler configuration.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: llvm-cache
        if: matrix.part == 'zluda'
        with:
          path: /work/ccache
          # Cache entries are immutable. A unique suffix lets a failed partial
          # build grow on the next run instead of freezing the first snapshot.
          key: llvm-v3-${{ hashFiles('packaging/zluda-overlay/*.py', 'packaging/zluda-overlay/*.sh', 'packaging/zluda-overlay/inputs.lock.json', 'packaging/zluda-overlay/inputs.valve-11-0.lock.json', 'packaging/zluda-overlay/profiles/*.json', '.github/workflows/zluda-overlay.yml', format('{0}/zluda/llvm_zluda/build.rs', env.PROTON_SOURCE_PATH), format('{0}/zluda/Cargo.lock', env.PROTON_SOURCE_PATH)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llvm-v3-${{ hashFiles('packaging/zluda-overlay/*.py', 'packaging/zluda-overlay/*.sh', 'packaging/zluda-overlay/inputs.lock.json', 'packaging/zluda-overlay/inputs.valve-11-0.lock.json', 'packaging/zluda-overlay/profiles/*.json', '.github/workflows/zluda-overlay.yml', format('{0}/zluda/llvm_zluda/build.rs', env.PROTON_SOURCE_PATH), format('{0}/zluda/Cargo.lock', env.PROTON_SOURCE_PATH)) }}-
            llvm-v3-483350ba9280dd175b284c01c1f746f26738a321427a98669a7fbea4349f78b8-
            llvm-v3-23fa01218aa55e179a94837df155005f72e9bb3c44ae3d74f93fe19f13697ded-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-cache
        with:
          path: |
            /work/cargo/registry/cache
            /work/cargo/registry/index
          key: cargo-archives-v2-${{ matrix.part }}-${{ hashFiles('packaging/zluda-overlay/*.py', 'packaging/zluda-overlay/*.sh', 'packaging/zluda-overlay/inputs.lock.json', 'packaging/zluda-overlay/inputs.valve-11-0.lock.json', 'packaging/zluda-overlay/profiles/*.json', '.github/workflows/zluda-overlay.yml', format('{0}/zluda/Cargo.lock', env.PROTON_SOURCE_PATH), format('{0}/zluda-wine/wine/zluda_wine/Cargo.lock', env.PROTON_SOURCE_PATH)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cargo-archives-v2-${{ matrix.part }}-${{ hashFiles('packaging/zluda-overlay/*.py', 'packaging/zluda-overlay/*.sh', 'packaging/zluda-overlay/inputs.lock.json', 'packaging/zluda-overlay/inputs.valve-11-0.lock.json', 'packaging/zluda-overlay/profiles/*.json', '.github/workflows/zluda-overlay.yml', format('{0}/zluda/Cargo.lock', env.PROTON_SOURCE_PATH), format('{0}/zluda-wine/wine/zluda_wine/Cargo.lock', env.PROTON_SOURCE_PATH)) }}-
      - name: Build in the locked Steam Runtime SDK
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          mkdir -p /work/logs
          docker pull "$SDK_IMAGE" 2>&1 | tee /work/logs/image.log
          docker run --rm --init --cpus=3 --memory=10g \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src" -v /work:/work \
            -e CI=true -e SOURCE_ROOT=/src -e BUILD_ROOT=/work/build \
            -e SDK_ROOT=/work/sdk/opt/rocm-7.2.4 -e DOWNLOAD_ROOT=/work/downloads \
            -e WINE_SDK_ROOT=/work/wine-sdk -e DESTDIR=/work/overlay \
            -e BUILD_PART="$PART" -e JOBS=3 -e CARGO_HOME=/work/cargo \
            -e CCACHE_DIR=/work/ccache -e CCACHE_BASEDIR=/src \
            -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE "$SDK_IMAGE" bash /recipes/packaging/zluda-overlay/ci-build.sh \
            2>&1 | tee /work/logs/build.log
      - name: Rebuild shipped bridge sources offline in the SDK
        if: matrix.part == 'bridges'
        run: |
          set -euo pipefail
          mkdir -p /work/archive-rebuild
          # Original checkout, Wine source/object tree and SDK are not mounted.
          docker run --rm --init --pull=never --network=none --cpus=3 --memory=6g \
            -v "$GITHUB_WORKSPACE/packaging/zluda-overlay:/recipe-source/packaging/zluda-overlay:ro" \
            -v /work/overlay/sources:/archives:ro -v /work/overlay/files/lib/wine-cuda/zluda/x86_64-unix:/shipped:ro -v /work/cargo:/cargo \
            -v /work/build/rust:/rust:ro -v /work/archive-rebuild:/rebuild \
            -e CARGO_HOME=/cargo \
            -e PATH=/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e ZLUDA_PACKAGING_PROFILE "$SDK_IMAGE" python3 /recipe-source/packaging/zluda-overlay/source_archive.py \
            --rebuild-archive /archives/zluda-wine.tar.gz --work /rebuild/run --shipped-unix /shipped/nvcuda.so
      - name: Preserve caches with runner ownership
        if: always()
        run: sudo chown -R "$USER:$USER" /work/cargo /work/ccache 2>/dev/null || true
      - name: Save completed or partial LLVM compiler cache
        if: always() && matrix.part == 'zluda' && steps.llvm-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /work/ccache
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Save checksum-verified Cargo archives after success or failure
        if: always() && steps.cargo-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /work/cargo/registry/cache
            /work/cargo/registry/index
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overlay-${{ matrix.part }}
          path: |
            /work/${{ matrix.part }}.tar.gz
            /work/${{ matrix.part }}.MANIFEST
            /work/valve-stock.tar.gz
            /work/VALVE-STOCK.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain CPU fixtures compiled with the matching Wine SDK
        if: matrix.part == 'bridges'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-cpu-fixtures
          path: /work/build/cpu-fixtures-package
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the full native CPU harness and SDK loader closure
        if: always() && matrix.part == 'zluda' && inputs.base == 'valve-11-0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cpu
          path: /work/build/native-cpu
          if-no-files-found: warn
          retention-days: 90
      - name: Retain W1 fixtures built from the same sources and SDK
        if: matrix.part == 'bridges'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w1-fixtures
          path: /work/build/w1-fixtures
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and Wine logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.part }}
          path: |
            /work/logs
            /work/build/wine/log
            /work/wine-sdk/ABI-RECEIPT.json
            /work/wine-sdk/WINE-SOURCE-AUDIT.json
            /work/wine-sdk/WINE-SOURCE-AUDIT.fragments
            /work/build/wine/changed-sources.txt
            /work/build/log
            /work/build/zluda-wine/artifacts
            /work/build/zluda-wine/WINE-CALLBACK-ATTESTATION.json
            /work/build/zluda-wine/WINE-CALLBACK-ATTESTATION.fragments
            /work/build/zluda-wine/*-native-libs.log
            /work/build/zluda-wine-draft/artifacts
            /work/build/zluda-wine-draft/x86_64-native-libs.log
            /work/overlay/provenance/ZLUDA-WINE.json
            /work/overlay/sources/zluda-wine.tar.gz.check.log
            /work/overlay/sources/zluda-wine.tar.gz.json
            /work/build/native
            /work/archive-rebuild/run/REBUILD.json
            /work/archive-rebuild/run/*.log
          if-no-files-found: warn
          retention-days: 14

  scope-cpu:
    if: ${{ !inputs.native_control_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZLUDA_WINE_BACKEND_SOURCE: ${{ github.workspace }}/backend-source
      CARGO_BUILD_JOBS: "3"
      ZLUDA_WINE_DECLARATIONS_ONLY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chkuendig/zluda-wine
          ref: ${{ env.BRIDGE_PIN }}
          path: scope-source
          persist-credentials: false
      - name: Checkout the admitted backend declaration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: chkuendig/ZLUDA
          ref: ${{ env.BACKEND_PIN }}
          path: backend-source
          persist-credentials: false
          sparse-checkout: |
            cuda_types/src
            cuda_macros/src
            dark_api/src
            zluda/src
      - name: Verify source pin and run native scope tests including 18 PCI parity cases
        run: |
          set -euo pipefail
          expected=$BRIDGE_PIN
          test "$(git -C scope-source rev-parse HEAD)" = "$expected"
          rustup toolchain install 1.99.0 --profile minimal
          python3 scope-source/wine/zluda_wine/tests/run_native_tests.py

  pe32-luid:
    if: ${{ !inputs.native_control_seed }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ZLUDA_WINE_BACKEND_SOURCE: ${{ github.workspace }}/backend-source
      CARGO_BUILD_JOBS: "3"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/pe32-luid
      ZLUDA_WINE_DECLARATIONS_ONLY: "1"
    steps:
      - name: Preserve pinned source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - name: Checkout the exact candidate LUID fixture source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chkuendig/zluda-wine
          ref: ${{ env.BRIDGE_PIN }}
          path: luid-source
          persist-credentials: false
      - name: Checkout the admitted backend declaration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: chkuendig/ZLUDA
          ref: ${{ env.BACKEND_PIN }}
          path: backend-source
          persist-credentials: false
          sparse-checkout: |
            cuda_types/src
            cuda_macros/src
            dark_api/src
            zluda/src
      - name: Verify source admission and install the pinned PE32 toolchain
        run: |
          $expected = $env:BRIDGE_PIN
          $actual = git -C luid-source rev-parse HEAD
          if ($actual -ne $expected) { throw "LUID fixture source pin mismatch" }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.99.0 i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PE32 801 stub, PCI forwarding and v3/v4 refusal probe
        run: |
          python luid-source/wine/zluda_wine/tests/run_pe32_luid.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/pe32-luid.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain PE32 LUID evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pe32-luid-evidence
          path: ${{ runner.temp }}/pe32-luid.log
          if-no-files-found: warn
          retention-days: 90

  w1-fixtures:
    if: always() && needs.assemble.result == 'success'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - name: Checkout the exact W1 fixture source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chkuendig/zluda-wine
          ref: ${{ env.BRIDGE_PIN }}
          path: w1-source
          sparse-checkout: wine/w1-fixtures
          persist-credentials: false
      - name: Download this run's W1 fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: w1-fixtures
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w1-fixtures
      - name: Download this run's fully rebuilt candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.TOOL_NAME }}
          path: ${{ runner.temp }}/candidate-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.base == 'valve-11-0'
        with:
          name: ci-steam-video
          path: ${{ runner.temp }}/steam-video
      - name: Prepare candidate
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          cd "$RUNNER_TEMP/candidate-download"
          sha256sum -c SHA256SUMS
          mkdir -p "$RUNNER_TEMP/tool" "$RUNNER_TEMP/w1-work"
          tar -xf ${{ env.TOOL_NAME }}.tar.gz --strip-components=1 -C "$RUNNER_TEMP/tool"
          cp SHA256SUMS "$RUNNER_TEMP/w1-work/TOOL-SHA256SUMS"
          mkdir -p "$RUNNER_TEMP/steam-video"
      - name: Run W1 fixtures without network or GPU
        timeout-minutes: 40
        run: |
          set -euo pipefail
          docker pull "$SDK_IMAGE"
          docker run --rm --init --network=none --cpus=3 --memory=6g --pids-limit=512 \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" -v "$RUNNER_TEMP/tool:/tool:ro" \
            -v "$RUNNER_TEMP/w1-fixtures:/fixtures:ro" -v "$RUNNER_TEMP/w1-work:/work" \
            -v "$RUNNER_TEMP/steam-video:/steam:ro" -e CI_STEAM_ROOT=/steam \
            -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE "$SDK_IMAGE" python3 /recipes/packaging/zluda-overlay/w1_cpu.py --source /src \
            --fixture-source /recipes/w1-source/wine/w1-fixtures --tool /tool --fixtures /fixtures --work /work/run \
            2>&1 | tee "$RUNNER_TEMP/w1-work/run.log"
      - name: Retain bounded W1 CPU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1-candidate-cpu-evidence
          path: |
            ${{ runner.temp }}/w1-work/run.log
            ${{ runner.temp }}/w1-work/TOOL-SHA256SUMS
            ${{ runner.temp }}/w1-work/run/CPU-RESULT.json
            ${{ runner.temp }}/w1-work/run/logs
          if-no-files-found: warn
          retention-days: 90

  assemble:
    if: ${{ !inputs.native_control_seed }}
    needs: components
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Export the complete public packaging sources and fetched-object inventory
        run: bash make/source-offer.sh "$RUNNER_TEMP/packaging-source-offer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaging-source-offer
          path: ${{ runner.temp }}/packaging-source-offer
          if-no-files-found: error
          retention-days: 90
      - uses: ./.github/actions/proton-source
      - name: Make room for archive assembly and SDK checks
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
          [[ $(df -B1 --output=avail "$RUNNER_TEMP" | tail -1) -ge 20000000000 ]]
      - name: Checkout pinned protonfixes
        if: inputs.base != 'valve-11-0'
        run: git -C "$PROTON_SOURCE_ROOT" submodule update --init --recursive -- protonfixes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: overlay-*
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/overlays
      - name: Assemble GE plus verified overlays
        env:
          SOURCE_ROOT: ${{ env.PROTON_SOURCE_ROOT }}
          BUILD_ROOT: ${{ runner.temp }}/assembly
          DOWNLOAD_ROOT: ${{ runner.temp }}/downloads
          DESTDIR: ${{ runner.temp }}/${{ env.TOOL_NAME }}
          OVERLAYS_ROOT: ${{ runner.temp }}/overlays
          OUTPUT_ROOT: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT"
          bash packaging/zluda-overlay/assemble.sh 2>&1 | tee "$RUNNER_TEMP/assembly.log"
      - name: Build CI-only Steam video providers
        if: inputs.base == 'valve-11-0'
        run: |
          set -euo pipefail
          git -C "$PROTON_SOURCE_ROOT" submodule update --init --depth=1 -- ffmpeg
          mkdir -p "$RUNNER_TEMP/video-build"
          docker pull "$SDK_IMAGE"
          docker run --rm --init --network=none --cpus=3 --memory=6g \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" -v "$RUNNER_TEMP/video-build:/work" \
            -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE -e CI=true -e JOBS=3 -e SDK_IMAGE \
            -e SOURCE_ROOT=/src -e BUILD_ROOT=/work/build -e FIXTURE_ROOT=/work/steam \
            "$SDK_IMAGE" bash /recipes/packaging/zluda-overlay/ci-steam-video.sh \
            2>&1 | tee "$RUNNER_TEMP/video-build/build.log"
          mv "$RUNNER_TEMP/video-build/steam" "$RUNNER_TEMP/steam-video"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.base == 'valve-11-0'
        with:
          name: ci-steam-video
          path: ${{ runner.temp }}/steam-video
          if-no-files-found: error
          retention-days: 14
      - name: Prepare external provider mount
        run: mkdir -p "$RUNNER_TEMP/steam-video"
      - name: Check ELF dependency closure in the pinned SDK
        run: |
          set -euo pipefail
          docker pull "$SDK_IMAGE"
          docker run --rm --init --cpus=3 --memory=6g \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" -v "$RUNNER_TEMP/${{ env.TOOL_NAME }}:/tool:ro" \
            -v "$RUNNER_TEMP/steam-video:/steam:ro" -e CI_STEAM_ROOT=/steam \
            -e DESTDIR=/tool -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE "$SDK_IMAGE" bash /recipes/packaging/zluda-overlay/check-loader.sh \
            2>&1 | tee "$RUNNER_TEMP/loader.log"
      - name: Checkout pinned CPU fixture sources
        run: GIT_LFS_SKIP_SMUDGE=1 git -C "$PROTON_SOURCE_ROOT" submodule update --init --filter=blob:none -- zluda zluda-wine
      - name: Download checksum-bound CPU fixtures from the bridges SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wine-cpu-fixtures
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cpu-fixtures
      - name: Admit the published GE control
        if: inputs.base == 'valve-11-0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash migration/d32/control.sh
          mkdir -p "$RUNNER_TEMP/ge-control"
          tar -xf "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/ge-control"
      - name: Admit the historical CI-built A1 control
        if: inputs.base == 'valve-11-0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/zluda-overlay/historical-a1.sh
      - name: Run headless Wine CPU gate without network or GPU
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wine-cpu"
          cpu_command=(python3)
          if [[ $ZLUDA_PACKAGING_PROFILE == valve-11-0 ]]; then cpu_command=(xvfb-run -a env CI_HEADLESS_DISPLAY=1 python3); fi
          # Sources/tool are immutable; only fixture build, prefix and logs write.
          # Private PID namespace and /tmp keep wineserver isolated. No GPU devices.
          docker run --rm --init --pull=never --network=none --cpus=3 --memory=6g --pids-limit=256 \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" -v "$RUNNER_TEMP/${{ env.TOOL_NAME }}:/tool:ro" \
            -v "$RUNNER_TEMP/wine-cpu:/work" -v "$RUNNER_TEMP/cpu-fixtures:/fixtures:ro" \
            -v "$RUNNER_TEMP/steam-video:/steam:ro" -e CI_STEAM_ROOT=/steam \
            -e JOBS=3 \
            -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE "$SDK_IMAGE" "${cpu_command[@]}" /recipes/packaging/zluda-overlay/wine_cpu.py \
            --source /src --tool /tool --work /work/run --prepared-fixtures /fixtures \
            2>&1 | tee "$RUNNER_TEMP/wine-cpu.log"
      - name: Cross GE to Valve and back, then exercise both NVAPI architectures
        if: inputs.base == 'valve-11-0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-tool"
          docker run --rm --init --network=none --cpus=3 --memory=6g --pids-limit=512 \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" \
            -v "$RUNNER_TEMP/${{ env.TOOL_NAME }}:/tool:ro" -v "$RUNNER_TEMP/ge-control:/control:ro" -v "$RUNNER_TEMP/a1-tool:/a1:ro" \
            -v "$RUNNER_TEMP/cross-tool:/work" -v "$RUNNER_TEMP/steam-video:/steam:ro" \
            -e CI_STEAM_ROOT=/steam -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE \
            "$SDK_IMAGE" xvfb-run -a env CI_HEADLESS_DISPLAY=1 python3 /recipes/packaging/zluda-overlay/cross_tool_cpu.py \
            --tool /tool --ge-tool /control --a1-tool /a1 --work /work/run \
            2>&1 | tee "$RUNNER_TEMP/cross-tool.log"
          docker run --rm --init --network=none --cpus=3 --memory=6g --pids-limit=512 \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            -v "$GITHUB_WORKSPACE:/recipes:ro" -v "$PROTON_SOURCE_ROOT:/src:ro" \
            -v "$RUNNER_TEMP/${{ env.TOOL_NAME }}:/tool:ro" -v "$RUNNER_TEMP/wine-cpu:/work" \
            -v "$RUNNER_TEMP/steam-video:/steam:ro" -e CI_STEAM_ROOT=/steam \
            -e PROTON_SOURCE_ROOT=/src -e ZLUDA_PACKAGING_PROFILE \
            "$SDK_IMAGE" python3 /recipes/packaging/zluda-overlay/nvapi_cpu.py \
            --tool /tool --fixtures /work/run/build --work /work/nvapi \
            2>&1 | tee "$RUNNER_TEMP/nvapi-cpu.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.base == 'valve-11-0'
        with:
          name: cross-and-nvapi-cpu
          path: |
            ${{ runner.temp }}/cross-tool.log
            ${{ runner.temp }}/cross-tool/run/RESULT.json
            ${{ runner.temp }}/cross-tool/run/GE-*/*/launcher.log
            ${{ runner.temp }}/cross-tool/run/A1-*/*/launcher.log
            ${{ runner.temp }}/nvapi-cpu.log
            ${{ runner.temp }}/wine-cpu/nvapi/*.json
            ${{ runner.temp }}/wine-cpu/nvapi/*.log
          if-no-files-found: warn
          retention-days: 90
      - name: Stage bounded CPU evidence without prefix traversal
        if: always()
        run: |
          python3 packaging/zluda-overlay/stage_cpu_evidence.py \
            --root "$RUNNER_TEMP" --dest "$RUNNER_TEMP/wine-cpu-evidence"
      - name: Retain CPU fixture evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-cpu-evidence
          path: ${{ runner.temp }}/wine-cpu-evidence
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.TOOL_NAME }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-assembly
          path: |
            ${{ runner.temp }}/assembly.log
            ${{ runner.temp }}/loader.log
            ${{ runner.temp }}/steam-video/CI-STEAM-VIDEO.json
          retention-days: 14

  release-audit:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/proton-source
      - name: Download this run's candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.TOOL_NAME }}
          path: ${{ runner.temp }}/B
      - name: Admit the published d32 product control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash migration/d32/control.sh
      - name: Compare every actual shipping member and both manifests
        if: inputs.base != 'valve-11-0'
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git -C "$PROTON_SOURCE_ROOT" submodule update --init --filter=blob:none -- zluda-wine
          python3 migration/d32/product_identity.py \
            --control "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" \
            --candidate "$RUNNER_TEMP/B/${{ env.TOOL_NAME }}.tar.gz" \
            --control-manifest "$RUNNER_TEMP/d32-control/MANIFEST" \
            --candidate-manifest "$RUNNER_TEMP/B/MANIFEST" \
            --output "$RUNNER_TEMP/PRODUCT-IDENTITY.json"
      - name: Retain the complete identity proof even on failure
        if: always() && inputs.base != 'valve-11-0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-identity
          path: ${{ runner.temp }}/PRODUCT-IDENTITY.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.base == 'valve-11-0'
        with:
          name: overlay-bridges
          path: ${{ runner.temp }}/stock
      - name: Admit historical A1 for the builtin inventory
        if: inputs.base == 'valve-11-0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/zluda-overlay/historical-a1.sh
      - name: Compare every Wine builtin against the published control and stock base
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/B"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          extra=()
          if [[ $ZLUDA_PACKAGING_PROFILE == valve-11-0 ]]; then extra=(--stock "$RUNNER_TEMP/stock/valve-stock.tar.gz" --a1 "$RUNNER_TEMP/a1-download/GE-Proton11-7-zluda.tar.gz"); fi
          python3 packaging/zluda-overlay/release_audit.py "${extra[@]}" \
            --candidate "$RUNNER_TEMP/B/${{ env.TOOL_NAME }}.tar.gz" \
            --control "$RUNNER_TEMP/d32-control/GE-Proton11-7-zluda.tar.gz" \
            --output "$RUNNER_TEMP/release-audit"
      - name: Retain the complete builtin and timestamp inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit
          path: |
            ${{ runner.temp }}/release-audit/*.json
            ${{ runner.temp }}/release-audit/*.tsv
          if-no-files-found: error
          retention-days: 90
