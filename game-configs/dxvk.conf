# dxvk.conf — GPU spoofing for PhysX detection
#
# Place this file in the game's executable directory
# (e.g., SteamApps/common/Batman Arkham Knight/Binaries/Win64/)
#
# Spoofs AMD GPU as NVIDIA RTX 3090 so PhysX/GameWorks
# libraries detect a supported GPU.

dxgi.customVendorId = 10de
dxgi.customDeviceId = 2204
dxgi.hideAmdGpu = True
